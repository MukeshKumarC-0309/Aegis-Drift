# Reverse proxy in front of the Aegis Drift API.
#
# Terminates client connections, enforces coarse rate limits at the edge (the
# application's own limiter protects a single replica; this protects the fleet),
# and upgrades the live-feed WebSocket.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
      '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
      '"duration":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$http_x_request_id","user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # Two zones: normal API traffic, and the much higher-volume ingest path.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    upstream aegisdrift_api {
        server api:8000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_set_header Connection        "";

        limit_conn conn 48;

        # Probes must never be rate limited or logged as noise.
        location /health {
            access_log off;
            proxy_pass http://aegisdrift_api;
        }

        # Metrics are internal-only; expose them through your scrape network instead.
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
            proxy_pass http://aegisdrift_api;
        }

        location /api/v1/stream/ {
            proxy_pass http://aegisdrift_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering off;
        }

        location /api/v1/events/ {
            limit_req zone=ingest burst=400 nodelay;
            proxy_pass http://aegisdrift_api;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://aegisdrift_api;
            proxy_read_timeout 90s;
        }

        # Hashed build assets are immutable, so they can be cached aggressively.
        location /assets/ {
            proxy_pass http://aegisdrift_api;
            proxy_cache_valid 200 30d;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Everything else is the SPA; the app returns index.html for unknown paths.
        location / {
            proxy_pass http://aegisdrift_api;
        }
    }
}

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisdrift"
version = "2.0.0"
description = "Aegis Drift - Identity Threat Detection & Response (ITDR) platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aegis Drift Engineering" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "gunicorn>=23.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.1.0",
  "passlib[argon2]>=1.7.4",
  "argon2-cffi>=23.1.0",
  "pyjwt>=2.9.0",
  "python-multipart>=0.0.12",
  "httpx>=0.27.0",
  "redis>=5.2.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.21.0",
  "numpy>=1.26.0",
  "python-dateutil>=2.9.0",
  "orjson>=3.10.0",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-python-dateutil",
  "faker>=30.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: fast isolated tests",
  "integration: tests that exercise the API surface",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/seed.py", "alembic/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
ignore = [
  "B008",     # FastAPI's Depends()/Query() defaults are the documented idiom
  "RUF012",   # ClassVar annotations on Pydantic/SQLAlchemy config dicts add noise
  # Analyst-facing copy deliberately uses typographic characters (— × → ½ σ).
  # They are correct in prose and rendered in the console, not accidental homoglyphs.
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

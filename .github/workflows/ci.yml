name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e "backend[dev]"

      - name: Lint
        run: |
          ruff check backend
          ruff format --check backend

      - name: Type check
        run: mypy backend/app
        continue-on-error: true  # advisory until the codebase is fully annotated

      - name: Test
        run: pytest backend/tests -q --cov=app --cov-report=xml --cov-report=term-missing
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-validation-x
          ENVIRONMENT: test

      - name: Verify migrations match the models
        run: |
          cd backend
          PYTHONPATH=. alembic upgrade head
          PYTHONPATH=. alembic check
          PYTHONPATH=. alembic downgrade base
        env:
          SECRET_KEY: ci-secret-key-that-is-long-enough-for-validation-x
          SQLITE_PATH: ./ci.db

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: frontend/dist
          retention-days: 7

  integration:
    name: Stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aegisdrift
          POSTGRES_PASSWORD: aegisdrift
          POSTGRES_DB: aegisdrift
        options: >-
          --health-cmd "pg_isready -U aegisdrift"
          --health-interval 5s --health-timeout 5s --health-retries 12
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
        ports: ['6379:6379']
    env:
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-validation-x
      POSTGRES_HOST: localhost
      POSTGRES_USER: aegisdrift
      POSTGRES_PASSWORD: aegisdrift
      POSTGRES_DB: aegisdrift
      REDIS_URL: redis://localhost:6379/0
      AUTO_SEED: 'true'
      RATE_LIMIT_ENABLED: 'false'
      FIRST_SUPERUSER_PASSWORD: CiSuperuser_2026!
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e "backend[dev]"

      - name: Apply migrations
        run: cd backend && PYTHONPATH=. alembic upgrade head

      - name: Start the API against PostgreSQL
        run: |
          cd backend
          PYTHONPATH=. uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8000/health/live >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"database": *"ok"'

      - name: Smoke test the running stack
        run: python scripts/smoke_test.py http://127.0.0.1:8000
        env:
          AEGISDRIFT_ADMIN_PASSWORD: CiSuperuser_2026!

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: aegisdrift:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and check its health endpoint
        run: |
          docker run -d --name aegisdrift-ci \
            -e SECRET_KEY=ci-secret-key-that-is-long-enough-for-validation-x \
            -e FIRST_SUPERUSER_PASSWORD='CiSuperuser_2026!' \
            -e AUTO_SEED=true \
            -p 8000:8000 aegisdrift:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health/live >/dev/null 2>&1 && break
            sleep 3
          done
          curl -fsS http://127.0.0.1:8000/health/live
          docker logs aegisdrift-ci | tail -30
          docker rm -f aegisdrift-ci

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
        continue-on-error: true

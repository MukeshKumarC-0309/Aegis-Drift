<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect width="32" height="32" rx="7" fill="#07090e" stroke="#222f46" stroke-width="1.5"/>
  
  <!-- Outer Shield Frame -->
  <path d="M16 4.5L7 8.5V15C7 20.8 10.8 26.2 16 27.5C21.2 26.2 25 20.8 25 15V8.5L16 4.5Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Shield Inner Border Highlight -->
  <path d="M16 6.2L8.5 9.5V15C8.5 20 11.7 24.6 16 25.8C20.3 24.6 23.5 20 23.5 15V9.5L16 6.2Z" 
        fill="#0c1017" fill-opacity="0.4" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.8"/>
        
  <!-- Exclamation Mark / Shield Alert Centerpiece -->
  <path d="M16 10.5V17" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="16" cy="20.5" r="1.25" fill="#ffffff"/>
</svg>
